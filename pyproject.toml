[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nth-near-duplicate-registry"
version = "2.0.0"
description = "Reproducible NTH filtering and registry-level evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "Pillow>=10.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "code/src"}

[tool.setuptools.packages.find]
where = ["code/src"]

